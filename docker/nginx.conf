server {
    listen 80 default_server;
    server_name _;

    # js-dos + emularity 用 SharedArrayBuffer, 必须 COOP/COEP
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    root /app/frontend/dist;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm application/octet-stream;
    gzip_min_length 1024;

    # 静态资源缓存 - 只缓存字体/图像 (.wasm 不在这, 避免与 /static/js-dos 冲突)
    location ~* \.(woff2?|ttf|otf|eot|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # emulators 在 backend/static (emularity 用)
    location /static/emularity/ {
        alias /app/backend/static/emularity/;
    }

    # js-dos 静态在 frontend/dist/js-dos (前端 build 复制过来)
    location /static/js-dos/ {
        alias /app/frontend/dist/js-dos/;
    }

    # API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 游戏 zip 文件
    location /files/ {
        alias /app/;
        add_header Accept-Ranges bytes;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
